
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mai | Your Anime Companion</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100d18;
      color: #f8f5ff;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: min(760px, 90vh);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #393047;
      border-radius: 20px;
      background: #191522;
      box-shadow: 0 20px 70px #0008;
    }

    header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #393047;
    }

    .avatar {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(135deg, #ed85bb, #7555b9);
    }

    h1 { font-size: 19px; margin: 0 0 6px; }
    .status { color: #bdaecb; font-size: 12px; }
    .online { color: #91e5b0; }

    .notice {
      text-align: center;
      padding: 10px;
      color: #bdaecb;
      font-size: 11px;
      background: #211a2b;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .mai {
      align-self: flex-start;
      background: #30263b;
      border-bottom-left-radius: 5px;
    }

    .you {
      align-self: flex-end;
      background: #7651ad;
      border-bottom-right-radius: 5px;
    }

    .name {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      color: #e3b9f5;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #393047;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 14px;
      color: white;
      background: #100d18;
      border: 1px solid #493b59;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus { border-color: #bb8aee; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: #b47add;
      color: #180f20;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #d3a5f2; }

    footer {
      padding: 0 12px 12px;
      color: #9789a6;
      text-align: center;
      font-size: 10px;
    }

    @media (max-width: 500px) {
      body { padding: 8px; }
      .app { height: 94vh; min-height: 430px; }
      header { padding: 14px; }
      #messages { padding: 14px; }
      .message { max-width: 90%; }
      form { padding: 10px; }
      button { padding: 0 14px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="avatar">M</div>
      <div>
        <h1>Mai Sakurajima</h1>
        <div class="status"><span class="online">● Online</span>
          · Anime fan companion
        </div>
      </div>
    </header>

    <div class="notice">
      Unofficial fan project · Your messages stay in this open page
    </div>

    <section id="messages" aria-live="polite">
      <div class="message mai">
        <span class="name">Mai</span>
        Oh? You finally showed up. I was starting to think
        you forgot about me. Hmph, what do you want to talk about?
      </div>
    </section>

    <form id="chat-form">
      <input id="user-input" placeholder="Talk to Mai..."
        autocomplete="off" aria-label="Your message" required>
      <button type="submit">Send ➤</button>
    </form>

    <footer>
      Demo chat for now — the real AI will be connected in a later step.
    </footer>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const messages = document.getElementById("messages");

    const replies = [
      "Hmph, don't get the wrong idea. I'm listening, that's all.",
      "Oh really? Tell me more. You've got my attention.",
      "You're surprisingly interesting to talk to, you know that?",
      "Well, I'm not going anywhere just yet. Keep talking.",
      "Is that so? Maybe I'll let you explain yourself."
    ];

    function addMessage(text, speaker) {
      const bubble = document.createElement("div");
      bubble.className = "message " + speaker;

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = speaker === "mai" ? "Mai" : "You";

      bubble.appendChild(name);
      bubble.appendChild(document.createTextNode(text));
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "you");
      input.value = "";

      const reply = replies[
        Math.floor(Math.random() * replies.length)
      ];

      setTimeout(function() {
        addMessage(reply, "mai");
      }, 500);
    });
  </script>
</body>
</html>
